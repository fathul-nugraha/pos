<style>
    .navbar {
        height: 60px;

        background: var(--surface);
        border-bottom: 1px solid var(--border);

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 16px;

        position: sticky;
        top: 0;
        z-index: 100;
    }

    .store-name {
        color: var(--primary);

        font-size: 18px;
        font-weight: 700;

        white-space: nowrap;
    }

    .menu {
        position: relative;
    }

    .menu__button {
        width: 40px;
        height: 40px;

        border: 1px solid var(--border);
        border-radius: 8px;

        background: var(--surface);
        color: var(--text);

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;
        list-style: none;
    }

    .menu__button::-webkit-details-marker {
        display: none;
    }

    .menu__button::marker {
        display: none;
    }

    .menu__icon {
        width: 20px;
        height: 14px;

        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .menu__icon span {
        display: block;

        width: 100%;
        height: 2px;

        border-radius: 2px;

        background: currentColor;
    }

    .menu[open] .menu__button {
        background: #f1f5f9;
    }

    .menu__dropdown {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;

        width: 210px;

        padding: 6px;

        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;

        box-shadow:
            0 10px 30px rgba(15, 23, 42, 0.10),
            0 2px 8px rgba(15, 23, 42, 0.05);
    }

    .menu__link {
        display: flex;
        align-items: center;

        min-height: 42px;

        padding: 0 12px;

        border-radius: 7px;

        color: var(--text);

        font-size: 14px;
    }

    .menu__link:hover {
        background: #f1f5f9;
    }

    .menu__divider {
        height: 1px;

        margin: 6px 4px;

        background: var(--border);
    }

    .menu__link--danger {
        color: var(--danger);
    }

    .menu__link--danger:hover {
        background: #fef2f2;
    }

    @media (min-width: 640px) {
        .navbar {
            padding: 0 24px;
        }
    }

    @media (min-width: 1024px) {
        .navbar {
            height: 64px;
            padding: 0 32px;
        }
    }
</style>


<nav class="navbar">

    <a href="#" class="store-name">
        Toko Makmur
    </a>

    <details class="menu">

        <summary class="menu__button" aria-label="Buka menu">

            <span class="menu__icon">
                <span></span>
                <span></span>
                <span></span>
            </span>

        </summary>

        <div class="menu__dropdown">

            <a href="#" class="menu__link">
                Dashboard
            </a>

            <a href="#" class="menu__link">
                Daftar Barang
            </a>

            <a href="#" class="menu__link">
                Transaksi
            </a>

            <a href="#" class="menu__link">
                Laporan
            </a>

            <a href="#" class="menu__link">
                Pengaturan
            </a>

            <div class="menu__divider"></div>

            <a href="#" class="menu__link menu__link--danger">
                Keluar
            </a>

        </div>

    </details>

</nav>
